<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | AMERICAN-LOOK</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0b2545;
            --accent-color: #d90429;
            --gold-color: #d4af37;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
            color: #333333;
        }

        .navbar {
            background-color: var(--primary-color) !important;
            border-bottom: 4px solid var(--accent-color);
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
        }

        .card-header {
            background-color: var(--primary-color) !important;
            color: #ffffff !important;
            border-top-left-radius: 12px !important;
            border-top-right-radius: 12px !important;
            border-bottom: 2px solid var(--accent-color);
            font-weight: 600;
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            border: 1px solid #dce0e3;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(11, 37, 69, 0.15);
        }

        .img-preview-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .img-preview-box {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #ccc;
            background: #e9ecef;
        }

        .table thead {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .btn-custom-primary {
            background-color: var(--primary-color);
            color: #fff;
            border-radius: 8px;
        }

        .btn-custom-primary:hover {
            background-color: #133a6b;
            color: #fff;
        }

        .precio-negro {
            color: #000000 !important;
            font-weight: 700;
        }

        .img-container-cropper {
            max-height: 400px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .img-container-cropper img {
            max-width: 100%;
            display: block;
        }

        .tab-btn {
            border-radius: 8px;
            font-weight: 600;
        }
        .tab-btn.active {
            background-color: var(--primary-color) !important;
            color: #ffffff !important;
            border-color: var(--primary-color) !important;
        }

        .text-gold {
            color: var(--gold-color) !important;
        }
        .btn-gold-outline {
            color: var(--gold-color);
            border: 1px solid var(--gold-color);
            background: transparent;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }
        .btn-gold-outline:hover {
            background-color: var(--gold-color);
            color: #0b2545;
        }
    </style>
</head>
<body>

    <!-- Verificación de Seguridad -->
    <script>
        (function() {
            let pass = sessionStorage.getItem("admin_auth");
            if (pass !== "130926") {
                let ingreso = prompt("Ingrese la contraseña de administrador:");
                if (ingreso === "130926") {
                    sessionStorage.setItem("admin_auth", "130926");
                } else {
                    alert("Contraseña incorrecta. Acceso denegado.");
                    window.location.href = "index.html";
                }
            }
        })();
    </script>

    <!-- Navbar -->
    <nav class="navbar navbar-dark shadow-sm py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="btn btn-gold-outline text-decoration-none d-flex align-items-center gap-2 px-3 py-2 fw-semibold" href="index.html">
                <i class="fas fa-store text-gold"></i> <span>Volver al Catálogo</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <span class="fw-bold text-gold fs-5 tracking-wide">AMERICAN-LOOK</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid my-4 px-4">
        <div class="row g-4">
            
            <!-- Columna Izquierda: Formulario -->
            <div class="col-lg-4 col-md-5">
                <div class="card shadow-sm sticky-top" style="top: 20px;">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-edit me-2"></i> <span id="tituloFormulario">Registrar Prenda</span></span>
                        <span class="badge bg-danger text-white">Admin (Firebase)</span>
                    </div>
                    <div class="card-body p-3">
                        <form id="formPrenda" onsubmit="guardarPrenda(event)">
                            <input type="hidden" id="prendaIdDoc">
                            <input type="hidden" id="imagenesBase64Json">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label fw-semibold small">Título de la Prenda</label>
                                    <input type="text" id="titulo" class="form-control form-control-sm" required placeholder="Ej: Champa de Cuero">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-semibold small">Categoría</label>
                                    <select id="categoria" class="form-select form-select-sm">
                                        <option value="Chamarras">Chamarras</option>
                                        <option value="Jeans">Jeans</option>
                                        <option value="Poleras">Poleras</option>
                                        <option value="Sudaderas">Sudaderas</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-semibold small">Talla</label>
                                    <input type="text" id="talla" class="form-control form-control-sm" required placeholder="Ej: M, L, 32">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-semibold small">Precio Ref. (Bs.)</label>
                                    <input type="number" step="0.01" id="precio" class="form-control form-control-sm" required placeholder="0.00">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-semibold small">Estado Físico</label>
                                    <select id="estado" class="form-select form-select-sm" required>
                                        <option value="Nuevo">Nuevo</option>
                                        <option value="Semi nuevo">Semi nuevo</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold small">Imágenes (Una o varias)</label>
                                    <input type="file" id="archivoImagenes" class="form-control form-control-sm" accept="image/*" multiple onchange="procesarArchivosNuevos(event)">
                                    <div id="previewContainer" class="img-preview-container d-none"></div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold small">Descripción Breve</label>
                                    <input type="text" id="descripcion" class="form-control form-control-sm" required placeholder="Detalles de diseño...">
                                </div>
                                <div class="col-12 d-flex gap-2 pt-1">
                                    <button type="submit" id="btnAccion" class="btn btn-custom-primary btn-sm fw-semibold w-100"><i class="fas fa-plus-circle me-1"></i> Publicar Prenda</button>
                                    <button type="button" id="btnCancelar" class="btn btn-outline-secondary btn-sm d-none" onclick="limpiarFormulario()">Cancelar</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Tablas e Inventario -->
            <div class="col-lg-8 col-md-7">
                <div class="card shadow-sm p-2 mb-3">
                    <div class="d-flex gap-2">
                        <button id="btnTabInventario" class="btn btn-outline-primary tab-btn flex-fill active" onclick="cambiarVistaDerecha('inventario')">
                            <i class="fas fa-boxes me-2"></i> Inventario General
                        </button>
                        <button id="btnTabHistorial" class="btn btn-outline-primary tab-btn flex-fill" onclick="cambiarVistaDerecha('historial')">
                            <i class="fas fa-history me-2"></i> Historial de Ventas
                        </button>
                    </div>
                </div>

                <!-- Inventario General -->
                <div id="vistaInventario" class="card shadow-sm">
                    <div class="card-header py-3">
                        <span><i class="fas fa-boxes me-2"></i> Inventario General (Disponibles en la Nube)</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-3">ID</th>
                                        <th>Imágenes</th>
                                        <th>Título</th>
                                        <th>Cat.</th>
                                        <th>Talla</th>
                                        <th>Precio</th>
                                        <th>Estado</th>
                                        <th class="text-center">Vendido</th>
                                        <th class="text-end pe-3">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaAdminStock"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Historial de Ventas -->
                <div id="vistaHistorial" class="card shadow-sm d-none">
                    <div class="card-header py-3">
                        <span><i class="fas fa-calendar-alt me-2"></i> Historial de Ventas Registradas</span>
                    </div>
                    <div class="card-body p-3">
                        <div id="accordionHistorialVentas">
                            <!-- Se llena dinámicamente -->
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal Cropper -->
    <div class="modal fade" id="modalCropper" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fas fa-crop me-2"></i> Ajustar e Inspeccionar Imágenes</h5>
                    <button type="button" class="btn-close btn-close-white" onclick="cancelarProcesoImagenes()"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span id="cropperContador" class="text-dark fw-bold">Imagen 1 de 1</span>
                        <div class="btn-group">
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="navegarCropper(-1)"><i class="fas fa-arrow-left me-1"></i> Anterior</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="navegarCropper(1)">Siguiente <i class="fas fa-arrow-right ms-1"></i></button>
                        </div>
                    </div>
                    <div class="img-container-cropper">
                        <img id="imageToCrop" src="">
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-between">
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="eliminarImagenActualCropper()"><i class="fas fa-trash me-1"></i> Eliminar esta foto</button>
                    <div>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="cancelarProcesoImagenes()">Cancelar todo</button>
                        <button type="button" class="btn btn-custom-primary btn-sm px-4" onclick="guardarYContinuarCropper()"><i class="fas fa-check me-1"></i> Guardar Recorte Actual y Siguiente</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Bootstrap y Cropper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- Conexión Firebase y Lógica del Panel Admin -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7I6kAzHBtNQMn0g_7LAPLer5fKpub-E",
            authDomain: "american-look.firebaseapp.com",
            projectId: "american-look",
            storageBucket: "american-look.firebasestorage.app",
            messagingSenderId: "632009260167",
            appId: "1:632009260167:web:248d5d076c46d09ff30c22",
            measurementId: "G-RY5V17QQY3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let listaPrendasMemoria = [];
        let cropper = null;
        let listaImagenesEnEdicion = []; 
        let indexImagenActual = 0;

        document.addEventListener("DOMContentLoaded", () => {
            onSnapshot(collection(db, "prendas"), (snapshot) => {
                listaPrendasMemoria = [];
                snapshot.forEach((docSnap) => {
                    listaPrendasMemoria.push({ idDoc: docSnap.id, ...docSnap.data() });
                });
                cargarTablaAdmin();
            });
        });

        window.cambiarVistaDerecha = function(vista) {
            const btnInventario = document.getElementById('btnTabInventario');
            const btnHistorial = document.getElementById('btnTabHistorial');
            const divInventario = document.getElementById('vistaInventario');
            const divHistorial = document.getElementById('vistaHistorial');

            if (vista === 'inventario') {
                btnInventario.classList.add('active');
                btnHistorial.classList.remove('active');
                divInventario.classList.remove('d-none');
                divHistorial.classList.add('d-none');
                cargarTablaAdmin();
            } else if (vista === 'historial') {
                btnHistorial.classList.add('active');
                btnInventario.classList.remove('active');
                divHistorial.classList.remove('d-none');
                divInventario.classList.add('d-none');
                cargarHistorialVentasAdmin();
            }
        };

        window.procesarArchivosNuevos = function(event) {
            const archivos = event.target.files;
            if (!archivos || archivos.length === 0) return;
            let cargadosPendientes = Array.from(archivos);
            listaImagenesEnEdicion = [];
            indexImagenActual = 0;
            let leidos = 0;
            cargadosPendientes.forEach((archivo, idx) => {
                const lector = new FileReader();
                lector.onload = function(e) {
                    listaImagenesEnEdicion[idx] = e.target.result;
                    leidos++;
                    if (leidos === cargadosPendientes.length) abrirModalCropperConLista();
                };
                lector.readAsDataURL(archivo);
            });
            event.target.value = '';
        };

        window.abrirModalCropperConLista = function() {
            if (listaImagenesEnEdicion.length === 0) return;
            indexImagenActual = 0;
            mostrarImagenActualEnCropper();
            new bootstrap.Modal(document.getElementById('modalCropper')).show();
        };

        window.mostrarImagenActualEnCropper = function() {
            const imageEl = document.getElementById('imageToCrop');
            imageEl.src = listaImagenesEnEdicion[indexImagenActual];
            document.getElementById('cropperContador').innerText = `Imagen ${indexImagenActual + 1} de ${listaImagenesEnEdicion.length}`;
            if (cropper) { cropper.destroy(); cropper = null; }
            setTimeout(() => {
                cropper = new Cropper(imageEl, { aspectRatio: 1, viewMode: 1, autoCropArea: 0.9, responsive: true });
            }, 200);
        };

        window.guardarYContinuarCropper = function() {
            if (cropper) {
                const canvas = cropper.getCroppedCanvas({ width: 800, height: 800 });
                listaImagenesEnEdicion[indexImagenActual] = canvas.toDataURL('image/jpeg', 0.9);
            }
            if (indexImagenActual < listaImagenesEnEdicion.length - 1) {
                indexImagenActual++;
                mostrarImagenActualEnCropper();
            } else {
                finalizarLoteImagenes();
            }
        };

        window.navegarCropper = function(dir) {
            if (cropper) {
                const canvas = cropper.getCroppedCanvas({ width: 800, height: 800 });
                listaImagenesEnEdicion[indexImagenActual] = canvas.toDataURL('image/jpeg', 0.9);
            }
            indexImagenActual += dir;
            if (indexImagenActual < 0) indexImagenActual = 0;
            if (indexImagenActual >= listaImagenesEnEdicion.length) indexImagenActual = listaImagenesEnEdicion.length - 1;
            mostrarImagenActualEnCropper();
        };

        window.eliminarImagenActualCropper = function() {
            if (listaImagenesEnEdicion.length <= 1) { alert("Debes mantener al menos una imagen."); return; }
            listaImagenesEnEdicion.splice(indexImagenActual, 1);
            if (indexImagenActual >= listaImagenesEnEdicion.length) indexImagenActual = listaImagenesEnEdicion.length - 1;
            mostrarImagenActualEnCropper();
        };

        window.finalizarLoteImagenes = function() {
            if (cropper) { cropper.destroy(); cropper = null; }
            document.getElementById('imagenesBase64Json').value = JSON.stringify(listaImagenesEnEdicion);
            const previewContainer = document.getElementById('previewContainer');
            previewContainer.innerHTML = '';
            previewContainer.classList.remove('d-none');
            listaImagenesEnEdicion.forEach(src => {
                previewContainer.innerHTML += `<img src="${src}" class="img-preview-box">`;
            });
            bootstrap.Modal.getInstance(document.getElementById('modalCropper')).hide();
        };

        window.cancelarProcesoImagenes = function() {
            if (cropper) { cropper.destroy(); cropper = null; }
            bootstrap.Modal.getInstance(document.getElementById('modalCropper')).hide();
        };

        window.cargarTablaAdmin = function() {
            const tbody = document.getElementById('tablaAdminStock');
            if (!tbody) return;
            tbody.innerHTML = '';
            const disponibles = listaPrendasMemoria.filter(p => (p.disponibilidad || "Disponible") === "Disponible");

            if (disponibles.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-4">No hay prendas disponibles en la base de datos.</td></tr>`;
                return;
            }

            disponibles.forEach(p => {
                let imgs = [];
                try { imgs = p.jsonImagenes ? JSON.parse(p.jsonImagenes) : [p.imagen]; } catch(e) { imgs = [p.imagen]; }
                let miniatura = `<div class="d-flex gap-1">`;
                imgs.forEach(i => miniatura += `<img src="${i}" style="width: 32px; height: 32px; object-fit: cover;" class="rounded">`);
                miniatura += `</div>`;

                tbody.innerHTML += `
                    <tr>
                        <td class="ps-3 fw-bold">#${p.id || 'N/A'}</td>
                        <td>${miniatura}</td>
                        <td class="fw-semibold">${p.titulo}</td>
                        <td>${p.categoria}</td>
                        <td><span class="badge bg-light text-dark border">${p.talla}</span></td>
                        <td class="precio-negro">Bs. ${Number(p.precio).toFixed(2)}</td>
                        <td><span class="badge bg-info text-dark">${p.estado || 'Nuevo'}</span></td>
                        <td class="text-center"><button class="btn btn-outline-danger btn-sm px-2 py-1" onclick="marcarVendido('${p.idDoc}', ${p.precio})"><i class="fas fa-check-circle"></i></button></td>
                        <td class="text-end pe-3">
                            <button class="btn btn-outline-primary btn-sm me-1" onclick="cargarEdicion('${p.idDoc}')"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-outline-danger btn-sm" onclick="eliminarPrenda('${p.idDoc}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        };

        window.guardarPrenda = async function(e) {
            e.preventDefault();
            const idDoc = document.getElementById('prendaIdDoc').value;
            const titulo = document.getElementById('titulo').value;
            const categoria = document.getElementById('categoria').value;
            const talla = document.getElementById('talla').value;
            const estado = document.getElementById('estado').value;
            const precio = parseFloat(document.getElementById('precio').value);
            const descripcion = document.getElementById('descripcion').value;
            let jsonImagenes = document.getElementById('imagenesBase64Json').value;

            try {
                if (idDoc) {
                    const prendaRef = doc(db, "prendas", idDoc);
                    let datosActualizados = { titulo, categoria, talla, estado, precio, descripcion };
                    if (jsonImagenes.trim() !== "") {
                        datosActualizados.jsonImagenes = jsonImagenes;
                        datosActualizados.imagen = JSON.parse(jsonImagenes)[0];
                    }
                    await updateDoc(prendaRef, datosActualizados);
                    alert("¡Prenda actualizada con éxito!");
                } else {
                    if (!jsonImagenes) { alert('Selecciona al menos una imagen.'); return; }
                    const nuevoId = listaPrendasMemoria.length > 0 ? Math.max(...listaPrendasMemoria.map(p => p.id || 0)) + 1 : 1;
                    
                    await addDoc(collection(db, "prendas"), {
                        id: nuevoId,
                        titulo,
                        categoria,
                        talla,
                        estado,
                        disponibilidad: "Disponible",
                        precio,
                        descripcion,
                        jsonImagenes,
                        imagen: JSON.parse(jsonImagenes)[0]
                    });
                    alert("¡Prenda registrada con éxito!");
                }
                limpiarFormulario();
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Hubo un error al guardar en la base de datos.");
            }
        };

        window.marcarVendido = async function(idDoc, precioSug) {
            let precioVentaStr = prompt("Ingrese el precio final de venta en Bolivianos (Bs.):", precioSug);
            if (precioVentaStr === null) return;
            let precioVenta = parseFloat(precioVentaStr);
            if (isNaN(precioVenta) || precioVenta < 0) { alert("Monto no válido."); return; }

            try {
                const prendaRef = doc(db, "prendas", idDoc);
                await updateDoc(prendaRef, { disponibilidad: "Agotado" });

                let prendaVendida = listaPrendasMemoria.find(p => p.idDoc === idDoc);
                let historial = JSON.parse(localStorage.getItem('american_look_ventas')) || [];
                historial.push({ 
                    idPrenda: prendaVendida.id, 
                    titulo: prendaVendida.titulo, 
                    talla: prendaVendida.talla, 
                    precioOriginal: Number(prendaVendida.precio), 
                    precioVenta: precioVenta, 
                    fecha: new Date().toISOString() 
                });
                localStorage.setItem('american_look_ventas', JSON.stringify(historial));
                alert("¡Venta registrada y stock actualizado!");
            } catch (error) {
                console.error("Error al marcar vendido: ", error);
                alert("Error al actualizar el estado de venta.");
            }
        };

        window.eliminarPrenda = async function(idDoc) {
            if (confirm('¿Estás seguro de eliminar esta prenda permanentemente?')) {
                try {
                    await deleteDoc(doc(db, "prendas", idDoc));
                    alert("Prenda eliminada.");
                } catch (error) {
                    console.error("Error al eliminar: ", error);
                    alert("Error al eliminar el registro.");
                }
            }
        };

        window.cargarEdicion = function(idDoc) {
            const prenda = listaPrendasMemoria.find(p => p.idDoc === idDoc);
            if (prenda) {
                document.getElementById('prendaIdDoc').value = prenda.idDoc;
                document.getElementById('titulo').value = prenda.titulo;
                document.getElementById('categoria').value = prenda.categoria;
                document.getElementById('talla').value = prenda.talla;
                document.getElementById('precio').value = prenda.precio;
                document.getElementById('estado').value = prenda.estado || "Nuevo";
                document.getElementById('descripcion').value = prenda.descripcion;
                let imgsJson = prenda.jsonImagenes || JSON.stringify([prenda.imagen]);
                document.getElementById('imagenesBase64Json').value = imgsJson;
                listaImagenesEnEdicion = JSON.parse(imgsJson);
                
                const previewContainer = document.getElementById('previewContainer');
                previewContainer.innerHTML = '';
                previewContainer.classList.remove('d-none');
                listaImagenesEnEdicion.forEach(src => {
                    previewContainer.innerHTML += `<img src="${src}" class="img-preview-box">`;
                });

                document.getElementById('tituloFormulario').innerText = `Editar Prenda`;
                document.getElementById('btnAccion').innerHTML = '<i class="fas fa-save me-1"></i> Guardar Cambios';
                document.getElementById('btnCancelar').classList.remove('d-none');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.limpiarFormulario = function() {
            document.getElementById('formPrenda').reset();
            document.getElementById('prendaIdDoc').value = '';
            document.getElementById('imagenesBase64Json').value = '';
            listaImagenesEnEdicion = [];
            document.getElementById('previewContainer').classList.add('d-none');
            document.getElementById('tituloFormulario').innerText = "Registrar Prenda";
            document.getElementById('btnAccion').innerHTML = '<i class="fas fa-plus-circle me-1"></i> Publicar Prenda';
            document.getElementById('btnCancelar').classList.add('d-none');
        };

        window.cargarHistorialVentasAdmin = function() {
            const contenedor = document.getElementById('accordionHistorialVentas');
            if (!contenedor) return;
            contenedor.innerHTML = '';
            let historial = JSON.parse(localStorage.getItem('american_look_ventas')) || [];

            if (historial.length === 0) {
                contenedor.innerHTML = `<p class="text-muted text-center py-4">No hay ventas registradas todavía.</p>`;
                return;
            }

            let html = `<ul class="list-group">`;
            historial.forEach((v, index) => {
                let fechaFormateada = new Date(v.fecha).toLocaleDateString();
                html += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-0 fw-bold">${v.titulo} (Talla: ${v.talla})</h6>
                            <small class="text-muted">Fecha: ${fechaFormateada} | Ref: Bs. ${v.precioOriginal}</small>
                        </div>
                        <span class="badge bg-success fs-6">Venta: Bs. ${v.precioVenta}</span>
                    </li>
                `;
            });
            html += `</ul>`;
            contenedor.innerHTML = html;
        };
    </script>
</body>
</html>
